[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-model"
version = "0.1.0"
description = "Full-purpose local AI coding assistant powered by GGUF models."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "llama-cpp-python>=0.3.16",
    "typer>=0.16.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
coding-model = "coding_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
